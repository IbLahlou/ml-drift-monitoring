[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-drift-monitoring"
version = "0.1.0"
description = "Operational data and model drift monitoring with PSI, KS, Wasserstein, JS divergence, and Prometheus metrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "prometheus-client>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["drift_monitor"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
